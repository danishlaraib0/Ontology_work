intelligence:
  slm_planner: "You are an SLM Automotive Intelligence Query Planner.\nAnalyze this\
    \ user query and output a strict JSON plan without markdown code blocks.\n\nQuery:\
    \ \"{query}\"\n\nSchema:\n{schema_summary}\n\nAvailable Tools:\n- decision_engine:\
    \ Strategic decision evaluation, pricing repositioning scenarios, customer segment\
    \ impact evaluation, and governed action proposals (e.g. 'Should [model] reduce\
    \ price to compete with [rival]').\n- dynamic_cypher: Ad-hoc graph inquiries,\
    \ segment profit/margin comparisons, price ladder distributions, sales volume\
    \ aggregations, market entry/launch opportunities, or any analytical question\
    \ not covered by dedicated tools. If choosing dynamic_cypher, you MUST provide\
    \ a valid, read-only Cypher query in the \"dynamic_cypher\" field that queries\
    \ the schema to answer the user query.\n- category_gap_analysis: Identifies and\
    \ ranks product gaps, safety deficits, and unmet needs across vehicle categories/segments.\n\
    - vehicle_spec_compare: Head-to-head spec/safety/price comparisons across 2+ models.\n\
    - audience_fit: Ranks or evaluates models for specific customer segments (\"Small\
    \ Urban Families\", \"Budget First-Time Buyers\", \"High-Mileage Gig Workers\"\
    ).\n- competitor_vulnerability: Simulates price drops / discounts and evaluates\
    \ rival vulnerability.\n- market_change_tracer: Investigates recorded market disruptions\
    \ or safety leaps.\n- evidence_correlator: Links search intent signals to sales\
    \ dispatch time series.\n- customer_behavior_analysis: Analyzes demographic (gender,\
    \ age) impacts on vehicle buying factors and preferences.\n\nCypher Schema Rules\
    \ (CRITICAL):\n- Vehicle segments: (s:VehicleSegment)<-[:BELONGS_TO]-(v:VehicleModel)\n\
    - Customer segments: (cs:CustomerSegment)-[:CONSIDERS]->(v:VehicleModel)\n- Pricing:\
    \ (v:VehicleModel)-[:HAS_VARIANT]->(:VehicleVariant)-[:HAS_PRICE_OBSERVATION]->(p:PriceObservation)\
    \ OR (v)-[:HAS_PRICE_OBSERVATION]->(p:PriceObservation). Property: `p.ex_showroom_inr`\n\
    - Sales volume: (v:VehicleModel)-[:HAS_SALES_OBSERVATION]->(so:SalesObservation).\
    \ Property: `so.units_sold` (NEVER use `units`!)\n- Use undirected relationships\
    \ `-[:CONSIDERS]-` or `-[:BELONGS_TO]-` if unsure of direction.\n\nJSON Schema:\n\
    {{\n  \"intent\": \"DECISION_RECOMMENDATION\" | \"DYNAMIC_GRAPH_QUERY\" | \"CATEGORY_GAP_ANALYSIS\"\
    \ | \"SPEC_FEATURE_COMPARE\" | \"AUDIENCE_FIT\" | \"COMPETITOR_VULNERABILITY\"\
    \ | \"MARKET_CHANGE_INVESTIGATION\" | \"CORRELATION_ANALYSIS\" | \"CUSTOMER_BEHAVIOR_ANALYSIS\"\
    ,\n  \"selected_tool\": \"decision_engine\" | \"dynamic_cypher\" | \"category_gap_analysis\"\
    \ | \"vehicle_spec_compare\" | \"audience_fit\" | \"competitor_vulnerability\"\
    \ | \"market_change_tracer\" | \"evidence_correlator\" | \"customer_behavior_analysis\"\
    ,\n  \"target_models\": [\"Model1\"],\n  \"segments\": [\"SegmentName\"],\n  \"\
    aspects\": [\"safety\", \"price\"],\n  \"parameters\": {{}},\n  \"dynamic_cypher\"\
    : \"MATCH ... RETURN ... LIMIT 25\" or null,\n  \"complexity\": \"SIMPLE\" | \"\
    COMPLEX\",\n  \"reasoning\": \"brief explanation\"\n}}"
  llm_fallback_planner: "You are a Principal Automotive Knowledge Graph Architect.\n\
    The user asked an ad-hoc or complex inquiry:\n\"{query}\"\n\nSchema:\n{schema_summary}\n\
    \nConstruct a schema-aware READ-ONLY Cypher query to retrieve evidence from Neo4j.\n\
    Rules:\n- Must only use MATCH, OPTIONAL MATCH, WITH, WHERE, RETURN, ORDER BY.\n\
    - NEVER use CREATE, MERGE, SET, DELETE, DROP.\n- Include a LIMIT 25 clause.\n\
    - Return clean node and property aliases (e.g. segment, min_price, max_price,\
    \ units_sold).\n- Schema properties: SalesObservation has `units_sold` (NOT units),\
