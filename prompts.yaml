    : []\n    }},\n    \"Exterior\": [],\n    \"Interior\": []\n  }},\n  \"feature_to_variant_map\"\
    : {{\n    \"Feature Name\": [\"ZXI\", \"ZXI+\"]\n  }},\n  \"key_differentiating_features\"\
    : []\n}}\n```\n\nReturn ONLY the JSON."
  competitor_master: "You are an automotive market intelligence analyst for the Indian\
