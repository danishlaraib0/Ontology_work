data_collector:
  vehicle_master: "You are an automotive data expert. Collect the complete Vehicle\
    \ Master record for:\n\nBrand: {brand}\nModel: {model}\nCountry: India\n\nSearch\
    \ and return a JSON object with EXACTLY these fields:\n\n```json\n{{\n  \"vehicle_id\"\
    : \"auto-generated slug like MARUTISUZUKI-DZIRE-2024\",\n  \"brand\": \"\",\n\
    \  \"model\": \"\",\n  \"generation\": \"e.g. Gen 3 (2024–present)\",\n  \"variants\"\
    : [\"LXI\", \"VXI\", \"ZXI\", \"ZXI+\"],\n  \"body_type\": \"Sedan / SUV / Hatchback\
    \ / MPV etc.\",\n  \"segment\": \"Entry Sedan / Compact Sedan / Mid-Size SUV etc.\"\
    ,\n  \"fuel_types\": [\"Petrol\", \"CNG\", \"Diesel\", \"EV\"],\n  \"powertrains\"\
    : [\"ICE\", \"CNG\", \"Hybrid\", \"EV\"],\n  \"launch_date\": \"YYYY-MM\",\n \
    \ \"discontinued_date\": null,\n  \"country\": \"India\",\n  \"price_range_inr\"\
    : {{\"min\": 0, \"max\": 0}},\n  \"manufacturing_plant\": \"\",\n  \"platform\"\
    : \"\",\n  \"competitors_primary\": [],\n  \"segment_position\": \"entry / mid\
    \ / premium\"\n}}\n```\n\nBe specific, factual, and accurate. Use Google Search\
    \ to verify current information.\nReturn ONLY the JSON, no markdown fences."
  spec_master: "You are an automotive specifications expert. Extract complete technical\
    \ specifications for:\n\nBrand: {brand}\nModel: {model}\nCountry: India\n\nReturn\
    \ a JSON object with these sections:\n\n```json\n{{\n  \"vehicle_id\": \"{vehicle_id}\"\
    ,\n  \"engine_options\": [\n    {{\n      \"engine_code\": \"\",\n      \"displacement_cc\"\
    : 0,\n      \"fuel_type\": \"\",\n      \"power_hp\": 0,\n      \"torque_nm\"\
    : 0,\n      \"transmission\": [\"Manual 5-speed\", \"AMT\"],\n      \"mileage_kmpl\"\
    : 0,\n      \"emission_norm\": \"BS6 Phase 2\"\n    }}\n  ],\n  \"dimensions\"\
    : {{\n    \"length_mm\": 0,\n    \"width_mm\": 0,\n    \"height_mm\": 0,\n   \
    \ \"wheelbase_mm\": 0,\n    \"boot_space_litres\": 0,\n    \"ground_clearance_mm\"\
    : 0,\n    \"kerb_weight_kg\": 0,\n    \"fuel_tank_litres\": 0,\n    \"seating_capacity\"\
    : 5\n  }},\n  \"safety\": {{\n    \"ncap_rating\": \"\",\n    \"airbags\": 0,\n\
    \    \"abs\": true,\n    \"esc\": false,\n    \"isofix\": true,\n    \"rear_parking_sensors\"\
    : true,\n    \"rear_camera\": true\n  }},\n  \"features_by_variant\": {{\n   \
    \ \"LXI\": [],\n    \"VXI\": [],\n    \"ZXI\": [],\n    \"ZXI+\": []\n  }},\n\
    \  \"connectivity\": {{\n    \"infotainment_size_inch\": 0,\n    \"apple_carplay\"\
    : false,\n    \"android_auto\": false,\n    \"connected_car\": false,\n    \"\
    voice_control\": false,\n    \"ota_updates\": false\n  }},\n  \"comfort\": {{\n\
    \    \"sunroof\": false,\n    \"ventilated_seats\": false,\n    \"auto_ac\": false,\n\
    \    \"rear_ac_vent\": false,\n    \"push_button_start\": false,\n    \"cruise_control\"\
    : false\n  }},\n  \"warranty\": {{\n    \"years\": 0,\n    \"km\": 0,\n    \"\
    battery_warranty\": null\n  }}\n}}\n```\n\nUse latest {brand} {model} data from\
    \ manufacturer website and automotive portals.\nReturn ONLY the JSON, no markdown\
    \ fences."
  feature_taxonomy: "You are an automotive product ontology expert. For the {brand}\
    \ {model}:\n\nBuild a structured Feature Taxonomy — categorise ALL features of\
    \ this vehicle into\nthe hierarchy below. For each feature, also note which variants\
    \ include it.\n\nReturn a JSON object:\n\n```json\n{{\n  \"vehicle_id\": \"{vehicle_id}\"\
    ,\n  \"taxonomy\": {{\n    \"Safety\": {{\n      \"Passive Safety\": [\"Dual Airbags\"\
    , \"6 Airbags\", ...],\n      \"Active Safety\": [\"ABS+EBD\", \"ESC\", \"Hill\
    \ Hold\", ...],\n      \"ADAS\": [\"Lane Departure Warning\", \"Automatic Emergency\
    \ Braking\", ...]\n    }},\n    \"Comfort\": {{\n      \"Climate\": [\"Manual\
    \ AC\", \"Auto Climate Control\", \"Rear AC Vents\"],\n      \"Seating\": [\"\
    Fabric Seats\", \"Leatherette\", \"Ventilated Seats\"],\n      \"Ergonomics\"\
    : [\"Tilt Steering\", \"Height-adjustable Driver Seat\"]\n    }},\n    \"Technology\"\
    : {{\n      \"Infotainment\": [\"7-inch Touchscreen\", \"9-inch Touchscreen\"\
    ],\n      \"Connectivity\": [\"Apple CarPlay\", \"Android Auto\", \"Connected\
    \ Car App\"],\n      \"Instruments\": [\"Digital Cluster\", \"Analog Cluster\"\
    , \"MID Display\"]\n    }},\n    \"Convenience\": {{\n      \"Entry\": [\"Remote\
    \ Keyless Entry\", \"Smart Key\", \"Push Button Start\"],\n      \"Visibility\"\
    : [\"Rear Camera\", \"360 Camera\", \"Parking Sensors\"],\n      \"Lighting\"\
    : [\"Halogen\", \"LED DRL\", \"Full LED\", \"Auto Headlamps\"]\n    }},\n    \"\
    Performance\": {{\n      \"Powertrain\": [\"Manual\", \"AMT\", \"DCT\", \"CVT\"\
